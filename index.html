const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const q = new URLSearchParams(location.search);
const guess = () => { const n = (navigator.language || '').toLowerCase(); return n.startsWith('zh') ? (/(cn|sg|hans)/.test(n) ? 'sc' : 'tc') : 'en'; };
let lang = ['tc', 'sc', 'en'].includes(q.get('lang')) ? q.get('lang') : (store.get('civ-lang') || guess());
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function apply() {
  const t = T[lang];
  document.documentElement.lang = t.htmlLang;
  document.title = t.brand;
  document.querySelectorAll('[data-t]').forEach((el) => { el.innerHTML = t[el.dataset.t]; });
  document.querySelectorAll('[data-doc]').forEach((el) => { el.href = `${REPO}/blob/main/docs/${el.dataset.doc}.${t.suffix}.md`; });
  document.getElementById('playLink').href = `player.html?lang=${lang}`;
  const gif = document.getElementById('heroGif'); gif.src = `docs/images/pullback_${t.gif}.gif`; gif.alt = t.cap;
  const st = document.getElementById('stills'); st.src = `docs/images/stills_${t.gif}.jpg`; st.alt = t.stillsH;
  document.getElementById('nums').innerHTML = t.nums.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('');
  document.getElementById('cmds').innerHTML = t.cmds.map(esc).join('\n');
  document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}
document.querySelectorAll('.lang button').forEach((b) => (b.onclick = () => {
  lang = b.dataset.lang; store.set('civ-lang', lang);
  const u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u);
  apply();
}));
apply();
</script>
</body>
</html>
